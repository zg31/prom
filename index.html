<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وزارة التربية والتعليم والتعليم الفني - مصر</title>
    <!-- Google Fonts: Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-color: #007bff; /* Egyptian Blue */
            --secondary-color: #6c757d; /* Gray */
            --accent-color: #28a745; /* Green */
            --light-bg: #f8f9fa; /* Light Gray Background */
            --dark-text: #343a40; /* Dark Text */
            --light-text: #ffffff; /* Light Text */
            --border-color: #dee2e6;
            --shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
            --transition-speed: 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            line-height: 1.6;
            color: var(--dark-text);
            background-color: var(--light-bg);
            direction: rtl;
            text-align: right;
        }

        a {
            text-decoration: none;
            color: var(--primary-color);
            transition: color var(--transition-speed);
        }

        a:hover {
            color: #0056b3;
        }

        ul {
            list-style: none;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }

        /* Header */
        header {
            background-color: var(--light-text);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary-color);
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: var(--dark-text);
            font-weight: 600;
            padding: 5px 0;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            right: 0;
            bottom: 0;
            width: 0;
            height: 2px;
            background-color: var(--primary-color);
            transition: width var(--transition-speed);
        }

        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 100%;
            left: 0; /* Adjust for RTL */
            right: auto;
        }

        .auth-buttons button {
            background-color: var(--primary-color);
            color: var(--light-text);
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color var(--transition-speed), transform var(--transition-speed);
        }

        .auth-buttons button:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }

        .burger-menu {
            display: none;
            cursor: pointer;
            flex-direction: column;
            gap: 5px;
        }

        .burger-menu .line {
            width: 25px;
            height: 3px;
            background-color: var(--dark-text);
            transition: all var(--transition-speed);
        }

        /* Hero Section */
        .hero-section {
            background: linear-gradient(rgba(0, 123, 255, 0.8), rgba(0, 123, 255, 0.6)), url('https://images.unsplash.com/photo-1546410531-bb4ffa7d605c?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=MnwzNjVlMjJ8MHwxfHNlYXJjaHw1NXx8ZWR1Y2F0aW9uJTIwYmFja2dyb3VuZHxlbnwxfHx8fHwxNjcwMDAwMDAw&ixlib=rb-4.0.3&q=80&w=1200') no-repeat center center/cover;
            color: var(--light-text);
            text-align: center;
            padding: 80px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 400px;
        }

        .hero-section h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .hero-section p {
            font-size: 1.3rem;
            max-width: 800px;
            margin-bottom: 30px;
            line-height: 1.8;
        }

        .hero-section .btn-primary {
            background-color: var(--accent-color);
            color: var(--light-text);
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: background-color var(--transition-speed), transform var(--transition-speed);
        }

        .hero-section .btn-primary:hover {
            background-color: #218838;
            transform: translateY(-3px);
        }

        /* General Section Styling */
        .section-padded {
            padding: 80px 0;
            text-align: center;
        }

        .section-padded.bg-light {
            background-color: var(--light-bg);
        }

        .section-padded h2 {
            font-size: 2.5rem;
            margin-bottom: 50px;
            color: var(--primary-color);
            position: relative;
            display: inline-block;
        }

        .section-padded h2::after {
            content: '';
            position: absolute;
            right: 0;
            bottom: -10px;
            width: 60%;
            height: 4px;
            background-color: var(--accent-color);
            left: 50%;
            transform: translateX(50%);
            border-radius: 2px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .card {
            background-color: var(--light-text);
            border-radius: 10px;
            box-shadow: var(--shadow);
            padding: 30px;
            text-align: center;
            transition: transform var(--transition-speed), box-shadow var(--transition-speed);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        }

        .card i {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        .card h3 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: var(--dark-text);
        }

        .card p {
            font-size: 1rem;
            color: var(--secondary-color);
            flex-grow: 1;
            margin-bottom: 20px;
        }

        .card .btn-secondary {
            display: inline-block;
            background-color: var(--accent-color);
            color: var(--light-text);
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: 600;
            transition: background-color var(--transition-speed);
            margin-top: auto; /* Push button to bottom */
        }

        .card .btn-secondary:hover {
            background-color: #218838;
        }

        /* Services Section Specifics */
        .service-categories {
            display: flex;
            flex-direction: column;
            gap: 60px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .service-categories h3 {
            font-size: 2rem;
            color: var(--dark-text);
            margin-bottom: 40px;
            position: relative;
            display: inline-block;
        }

        .service-categories h3::after {
            content: '';
            position: absolute;
            right: 0;
            bottom: -10px;
            width: 80%;
            height: 3px;
            background-color: var(--primary-color);
            left: 50%;
            transform: translateX(50%);
            border-radius: 2px;
        }

        /* News Section */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .news-card {
            background-color: var(--light-text);
            border-radius: 10px;
            box-shadow: var(--shadow);
            overflow: hidden;
            text-align: right;
            transition: transform var(--transition-speed), box-shadow var(--transition-speed);
        }

        .news-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        }

        .news-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            object-position: center;
            transition: transform var(--transition-speed);
        }

        .news-card:hover img {
            transform: scale(1.05);
        }

        .news-content {
            padding: 25px;
        }

        .news-content h4 {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: var(--primary-color);
            line-height: 1.4;
        }

        .news-content p {
            font-size: 0.95rem;
            color: var(--secondary-color);
            margin-bottom: 15px;
            max-height: 70px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .news-content .read-more {
            color: var(--accent-color);
            font-weight: 600;
            display: inline-block;
            margin-top: 10px;
        }

        /* How it Works Section */
        .steps-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .step-card {
            background-color: var(--light-text);
            border-radius: 10px;
            box-shadow: var(--shadow);
            padding: 30px;
            text-align: center;
            width: 300px;
            position: relative;
            transition: transform var(--transition-speed);
        }

        .step-card:hover {
            transform: translateY(-5px);
        }

        .step-card .step-number {
            background-color: var(--primary-color);
            color: var(--light-text);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0 auto 20px;
            position: relative;
            z-index: 1;
        }

        .step-card h4 {
            font-size: 1.4rem;
            color: var(--dark-text);
            margin-bottom: 15px;
        }

        .step-card p {
            color: var(--secondary-color);
            font-size: 0.95rem;
        }

        /* About & Contact Sections */
        .text-content {
            max-width: 800px;
            margin: 0 auto;
            text-align: justify;
            padding: 0 15px;
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--dark-text);
        }

        .text-content p + p {
            margin-top: 20px;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 600px;
            margin: 0 auto;
            text-align: right;
            padding: 0 15px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.1rem;
            color: var(--dark-text);
        }

        .contact-item i {
            color: var(--primary-color);
            font-size: 1.5rem;
            min-width: 30px;
            text-align: center;
        }

        /* Footer */
        footer {
            background-color: var(--dark-text);
            color: var(--light-text);
            padding: 40px 0;
            text-align: center;
            font-size: 0.9rem;
        }

        footer .footer-links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 25px;
        }

        footer .footer-links a {
            color: var(--light-text);
            opacity: 0.8;
            transition: opacity var(--transition-speed);
        }

        footer .footer-links a:hover {
            opacity: 1;
        }

        .social-icons {
            margin-top: 20px;
            margin-bottom: 25px;
        }

        .social-icons a {
            color: var(--light-text);
            font-size: 1.5rem;
            margin: 0 10px;
            transition: color var(--transition-speed);
        }

        .social-icons a:hover {
            color: var(--primary-color);
        }

        /* Modal Styling */
        .modal {
            display: none; /* Hidden by default */
            position: fixed; /* Stay in place */
            z-index: 2000; /* Sit on top */
            left: 0;
            top: 0;
            width: 100%; /* Full width */
            height: 100%; /* Full height */
            overflow: auto; /* Enable scroll if needed */
            background-color: rgba(0, 0, 0, 0.6); /* Black w/ opacity */
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity var(--transition-speed), visibility var(--transition-speed);
        }

        .modal.show {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background-color: var(--light-bg);
            margin: auto;
            padding: 40px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            position: relative;
            transform: translateY(-50px);
            opacity: 0;
            transition: transform var(--transition-speed) 0.1s, opacity var(--transition-speed) 0.1s;
            text-align: right;
        }

        .modal.show .modal-content {
            transform: translateY(0);
            opacity: 1;
        }

        .close-button {
            color: #aaa;
            position: absolute;
            top: 15px;
            left: 25px; /* Adjust for RTL */
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: color var(--transition-speed);
        }

        .close-button:hover,
        .close-button:focus {
            color: var(--dark-text);
            text-decoration: none;
        }

        .modal-content h2 {
            margin-bottom: 30px;
            color: var(--primary-color);
            font-size: 2rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark-text);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-size: 1rem;
            font-family: 'Cairo', sans-serif;
            color: var(--dark-text);
            background-color: #fff;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25);
        }

        .modal-content .btn-primary {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: var(--light-text);
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color var(--transition-speed), transform var(--transition-speed);
        }

        .modal-content .btn-primary:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            .nav-links {
                gap: 15px;
            }

            .hero-section h1 {
                font-size: 2.8rem;
            }

            .hero-section p {
                font-size: 1.1rem;
            }

            .section-padded h2 {
                font-size: 2rem;
            }

            .card h3 {
                font-size: 1.3rem;
            }

            .news-content h4 {
                font-size: 1.2rem;
            }

            .service-categories h3 {
                font-size: 1.8rem;
            }
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 75px; /* Height of header */
                right: 0;
                width: 100%;
                background-color: var(--light-text);
                box-shadow: var(--shadow);
                padding: 20px 0;
                border-top: 1px solid var(--border-color);
                z-index: 999;
            }

            .nav-links.active {
                display: flex;
            }

            .nav-links li {
                text-align: center;
                margin: 10px 0;
            }

            .nav-links a {
                padding: 10px 0;
                display: block;
            }

            .burger-menu {
                display: flex;
            }

            .auth-buttons {
                margin-left: 15px; /* Adjust for RTL */
            }

            .hero-section {
                padding: 60px 15px;
                min-height: 350px;
            }

            .hero-section h1 {
                font-size: 2.2rem;
            }

            .hero-section p {
                font-size: 1rem;
            }

            .section-padded {
                padding: 60px 0;
            }

            .section-padded h2 {
                font-size: 1.8rem;
                margin-bottom: 40px;
            }

            .grid-container,
            .news-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .card {
                padding: 25px;
            }

            .card i {
                font-size: 2.5rem;
            }

            .card h3 {
                font-size: 1.2rem;
            }

            .service-categories {
                gap: 40px;
            }

            .service-categories h3 {
                font-size: 1.6rem;
                margin-bottom: 30px;
            }
